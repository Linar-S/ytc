<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{% block meta_description %}YouTube-клон — учебный проект на FastAPI{% endblock %}">
  <title>{% block title %}YouTube-клон{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="flex min-h-full flex-col bg-gray-50 text-gray-900 antialiased">
  <header class="sticky top-0 z-10 border-b border-gray-200 bg-white" x-data="{ open: false }">
    <nav class="mx-auto flex w-full max-w-7xl flex-wrap items-center gap-2 px-4 py-3 sm:gap-4 sm:px-6 lg:px-8" aria-label="Основная навигация">
      <a href="/" class="text-lg font-semibold tracking-tight text-red-600">YouTube-клон</a>

      <button type="button"
              class="ml-auto inline-flex items-center rounded-md p-2 text-gray-600 hover:bg-gray-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-red-500 sm:hidden"
              aria-controls="primary-menu" :aria-expanded="open" @click="open = !open">
        <span class="sr-only">Открыть меню</span>
        <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

      <div id="primary-menu"
           class="w-full flex-col gap-2 sm:ml-auto sm:flex sm:w-auto sm:flex-row sm:items-center sm:gap-4"
           :class="open ? 'flex' : 'hidden sm:flex'">
        <a href="/" class="rounded-md px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100">Главная</a>
        <a href="/upload" class="rounded-md px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100">Загрузить</a>
        <a href="/moderation" class="rounded-md px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100">Модерация</a>
        <a href="/docs" class="rounded-md px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100">API</a>
        <a href="/health" class="rounded-md px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100">Health</a>
      </div>
    </nav>
  </header>

  <main class="mx-auto w-full max-w-7xl flex-1 px-4 py-6 sm:px-6 sm:py-8 lg:px-8">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-gray-200 bg-white">
    <div class="mx-auto w-full max-w-7xl px-4 py-4 text-sm text-gray-500 sm:px-6 lg:px-8">
      &copy; 2026 YouTube-клон. Учебный проект.
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
