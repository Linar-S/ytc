{% extends "base.html" %}

{% block title %}Главная — YouTube-клон{% endblock %}

{% block content %}
<section class="mx-auto max-w-3xl text-center">
  <h1 class="text-2xl font-bold tracking-tight sm:text-3xl">YouTube-клон</h1>
  <p class="mt-3 text-base text-gray-600 sm:text-lg">
    Загружайте видео напрямую в MinIO, а backend обработает запись и превью.
  </p>
  <div class="mt-6 flex flex-col items-stretch justify-center gap-3 sm:flex-row sm:items-center">
    <a href="/upload" class="rounded-lg bg-red-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-red-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-red-500 focus-visible:ring-offset-2">
      Загрузить видео
    </a>
    <a href="/docs" class="rounded-lg border border-gray-300 px-5 py-2.5 text-sm font-semibold text-gray-700 hover:bg-gray-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-red-500 focus-visible:ring-offset-2">
      Открыть Swagger
    </a>
    <a href="/health" class="rounded-lg border border-gray-300 px-5 py-2.5 text-sm font-semibold text-gray-700 hover:bg-gray-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-red-500 focus-visible:ring-offset-2">
      Проверить /health
    </a>
  </div>
</section>
{% endblock %}
