name: youtube-copy

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
  image: youtube-copy-backend:local
  env_file:
    - path: .env
      required: false
  environment: &app-environment
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-youtube}:${POSTGRES_PASSWORD:-change-me-postgres}@postgres:5432/${POSTGRES_DB:-youtube}"
    REDIS_URL: "redis://redis:6379/0"
    SECRET_KEY: "${SECRET_KEY:-change-me-generate-with-openssl-rand-hex-32}"
    MINIO_ENDPOINT: "minio:9000"
    MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT:-localhost:9000}"
    MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
    MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-change-me-minio}"
    MINIO_BUCKET: "${MINIO_BUCKET:-youtube}"
    MINIO_SECURE: "false"
  restart: unless-stopped
  networks:
    - backend

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-youtube}"
      POSTGRES_USER: "${POSTGRES_USER:-youtube}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me-postgres}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-youtube} -d ${POSTGRES_DB:-youtube}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - backend

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-change-me-minio}"
      MINIO_API_CORS_ALLOW_ORIGIN: "${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:8000}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend

  backend:
    <<: *app-common
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    <<: *app-common
    command: ["arq", "app.workers.settings.WorkerSettings"]
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  backend:
    driver: bridge